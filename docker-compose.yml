# Used only if you deploy this app in Dokploy as a "Docker Compose" application.
# If you deploy it as a plain "Application" (Dockerfile) instead, Dokploy builds
# the Dockerfile directly and this file isn't needed — see DOKPLOY.md.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mahdi-ibrahim.dev}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mahdi-ibrahim.dev}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
